services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}

    volumes:
      - eventhub-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped
  
  cache:
    image: redis:7-alpine
    command: [ "redis-server", "--save", "", "--appendonly", "no" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
  
  migrate:
    image: ghcr.io/meissnerm224/eventhub:latest
    entrypoint: [ "dotnet", "EventHub.Api.dll", "--migrate-only" ]
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__Redis: "cache:6379"
      Jwt__Key: ${JWT_KEY:?required}
      Jwt__Issuer: EventHub
      Jwt__Audience: EventHub
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  storage-init:
    build: ./garage
    image: ghcr.io/meissnerm224/eventhub-garage-init:latest
    depends_on:
      storage: { condition: service_healthy }
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?required}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?required}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?required}
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - ./garage/init.sh:/init.sh:ro
      - garage-meta:/var/lib/garage/meta
    entrypoint: ["/bin/sh", "/init.sh"]
    restart: "no"
  
  api:
    image: ghcr.io/meissnerm224/eventhub:latest
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__Redis: "cache:6379"
      Jwt__Key: ${JWT_KEY:?required}
      Jwt__Issuer: EventHub
      Jwt__Audience: EventHub
      Storage__Endpoint: "http://storage:3900"
      Storage__AccessKey: ${STORAGE_ACCESS_KEY:?required}
      Storage__SecretKey: ${STORAGE_SECRET_KEY:?required}
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8080/health" ]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  storage:
    image: dxflrs/garage:ddb90621c1e7e9d98cf0b4088802f31cac57587b
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?required}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?required}
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - ./garage/init.sh:/init.sh:ro
      - garage-meta:/var/lib/garage/meta
    healthcheck:
      test: [ "CMD", "/garage", "status" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
  
  proxy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  eventhub-db-data:
  garage-meta:
  garage-data:
  caddy-data:
  caddy-config:
